[package]
name = "valorant-streamer-radar"
version = "1.2.12"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "ValorantStreamerRadar"
path = "src/main.rs"

[dependencies]
# Pure CPU software UI + Win32 GDI BitBlt via softbuffer: zero DirectX/DXGI/OpenGL/Vulkan swapchains,
# so NVIDIA G-SYNC and the top-right "G-SYNC"/"NORMAL" overlay can never activate on the app window.
# Note: egui/egui-winit stay pinned to 0.33 to match egui_software_backend 0.0.2 (0.37 is not yet supported).
egui = { version = "0.33", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.33", default-features = false, features = ["clipboard", "links"] }
egui_software_backend = { version = "0.0.2", default-features = false, features = ["std"] }
winit = "0.30"
softbuffer = "0.4"
bytemuck = "1"
tray-icon = "0.27"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "query", "form", "http2", "charset", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.23"
open = "5"
arboard = { version = "3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
# notify-rust cannot do click actions on Windows (`.action()` / `wait_for_action` are XDG-only),
# so toasts use the WinRT API directly.
tauri-winrt-notification = "0.8"
winreg = "0.56"

[target.'cfg(windows)'.build-dependencies]
# Embeds the AMOLED black & pink-to-pearl gradient rounded-square "V" multi-resolution icon into ValorantStreamerRadar.exe.
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# NOTE: Do NOT set panic = "abort" - the background scan worker catches task panics via JoinHandle.
