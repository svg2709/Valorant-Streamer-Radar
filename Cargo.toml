[package]
name = "valorant-streamer-radar"
version = "1.0.1"
edition = "2021"
rust-version = "1.80" # std::sync::LazyLock

[[bin]]
name = "ValorantStreamerRadar"
path = "src/main.rs"

[dependencies]
# Trimmed feature sets keep RAM / binary size down (no accesskit, no wgpu, no image decoding).
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.19"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"
open = "5"
arboard = { version = "3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# notify-rust cannot do click actions on Windows (`.action()` / `wait_for_action` are XDG-only),
# so toasts use the WinRT API directly.
tauri-winrt-notification = "0.7"
winreg = "0.52"

[target.'cfg(windows)'.build-dependencies]
# Embeds the dark obsidian & pink-to-white gradient "V" multi-resolution icon into ValorantStreamerRadar.exe.
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# NOTE: Do NOT set panic = "abort" — the background scan worker catches task panics via JoinHandle.
