name: Build Windows Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV 1.80+)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting and compile release binary
        run: cargo build --release --locked
        continue-on-error: true
        id: build_locked

      - name: Build release binary (generate Cargo.lock if absent)
        if: steps.build_locked.outcome == 'failure'
        run: cargo build --release

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: val-streamer-notifier-windows-x64
          path: target/release/val-streamer-notifier.exe
          if-no-files-found: error

      - name: Attach executable to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/val-streamer-notifier.exe
