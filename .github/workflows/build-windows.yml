name: Build Windows Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain (MSRV 1.80+)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Windows release executable
        run: cargo build --release

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "target/release/ValorantStreamerRadar.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  ValorantStreamerRadar.exe" | Out-File -FilePath "target/release/ValorantStreamerRadar.exe.sha256" -Encoding ascii

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v6
        with:
          name: ValorantStreamerRadar-windows-x64
          path: |
            target/release/ValorantStreamerRadar.exe
            target/release/ValorantStreamerRadar.exe.sha256
          if-no-files-found: error

      - name: Publish to GitHub Releases (Latest Build)
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n 1)
          TITLE="Valorant Streamer Radar v${VER}"
          cat > release-notes.md <<EOF
          Automated Windows x64 build of **Valorant Streamer Radar v${VER}** from commit \`${GITHUB_SHA}\`.

          ### Quick Install
          1. Download **\`ValorantStreamerRadar.exe\`** below.
          2. Run it on Windows 10/11 while Valorant is installed (if Windows SmartScreen prompts for an unsigned open-source \`.exe\`, click **More info -> Run anyway**).
          3. Runs silently in the system tray (~50-60 MB RAM, ~0% idle CPU) and scans strictly after each match ends.

          > **Disclaimer:** Use at your own risk. See the [README](https://github.com/${GITHUB_REPOSITORY}#is-this-bannable) for safety details.
          EOF

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "${TITLE}" --notes-file release-notes.md --latest
            gh release upload latest "target/release/ValorantStreamerRadar.exe" "target/release/ValorantStreamerRadar.exe.sha256" --clobber
            gh release delete-asset latest val-streamer-notifier.exe --yes >/dev/null 2>&1 || true
            gh release delete-asset latest val-streamer-notifier.exe.sha256 --yes >/dev/null 2>&1 || true
          else
            gh release create latest "target/release/ValorantStreamerRadar.exe" "target/release/ValorantStreamerRadar.exe.sha256" --title "${TITLE}" --notes-file release-notes.md --target "${GITHUB_SHA}" --latest
          fi

      - name: Publish to GitHub Releases (Versioned Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "target/release/ValorantStreamerRadar.exe" "target/release/ValorantStreamerRadar.exe.sha256" --clobber
          else
            gh release create "${TAG}" "target/release/ValorantStreamerRadar.exe" "target/release/ValorantStreamerRadar.exe.sha256" --title "Valorant Streamer Radar ${TAG}" --generate-notes --latest
          fi
