name: Build Windows Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain (MSRV 1.85+)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Rust unit tests
        run: cargo test -- --nocapture

      - name: Build Windows release executable
        run: cargo build --release

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "target/release/ValorantStreamerRadar.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  ValorantStreamerRadar.exe" | Out-File -FilePath "target/release/ValorantStreamerRadar.exe.sha256" -Encoding ascii

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v6
        with:
          name: ValorantStreamerRadar-windows-x64
          path: |
            target/release/ValorantStreamerRadar.exe
            target/release/ValorantStreamerRadar.exe.sha256
          if-no-files-found: error

      - name: Publish Versioned GitHub Release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n 1)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VER}"
          fi
          TITLE="Valorant Streamer Radar ${TAG}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          # Extract the matching version section from CHANGELOG.md as the authoritative release notes
          CHANGELOG_NOTES=$(awk -v ver="${VER}" '
            BEGIN { in_sec = 0 }
            /^## \[/ {
              if (in_sec) exit
              if (index($0, "## [" ver "]") == 1) { in_sec = 1; next }
            }
            in_sec { print }
          ' CHANGELOG.md || true)

          {
            echo "Windows x64 release of **Valorant Streamer Radar ${TAG}** (commit \`${SHORT_SHA}\`)."
            echo ""
            if [[ -n "${CHANGELOG_NOTES}" ]]; then
              echo "### What's Changed in ${TAG}"
              echo "${CHANGELOG_NOTES}"
              echo ""
            fi
            cat <<EOF
          ### Quick Install
          1. Download **\`ValorantStreamerRadar.exe\`** below.
          2. Run it on Windows 10/11 while Valorant is installed (if Windows SmartScreen prompts for an unsigned open-source \`.exe\`, click **More info -> Run anyway**).
          3. Runs silently in the system tray and scans strictly after each match ends (not a stream-sniping tool).

          > **Disclaimer:** Use at your own risk. Detection is not 100% accurate. See the [README](https://github.com/${GITHUB_REPOSITORY}#detection-limitations) for details.
          EOF
          } > release-notes.md

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TITLE}" --notes-file release-notes.md --latest
            gh release upload "${TAG}" "target/release/ValorantStreamerRadar.exe" "target/release/ValorantStreamerRadar.exe.sha256" --clobber
          else
            gh release create "${TAG}" "target/release/ValorantStreamerRadar.exe" "target/release/ValorantStreamerRadar.exe.sha256" --title "${TITLE}" --notes-file release-notes.md --target "${GITHUB_SHA}" --latest
          fi

          # Clean up legacy rolling 'latest' release/tag so the Releases tab only shows clean versioned releases
          gh release delete latest --yes --cleanup-tag >/dev/null 2>&1 || true
