name: Build Windows Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain (MSRV 1.80+)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Windows release executable
        run: cargo build --release

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "target/release/val-streamer-notifier.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  val-streamer-notifier.exe" | Out-File -FilePath "target/release/val-streamer-notifier.exe.sha256" -Encoding ascii

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v6
        with:
          name: val-streamer-notifier-windows-x64
          path: |
            target/release/val-streamer-notifier.exe
            target/release/val-streamer-notifier.exe.sha256
          if-no-files-found: error

      - name: Publish to GitHub Releases (Latest Build)
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = $env:GITHUB_SHA
          $repo = $env:GITHUB_REPOSITORY
          $ver = (Select-String -Path "Cargo.toml" -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $title = "Valorant Streamer Radar v$ver"
          $notes = @(
            "Automated Windows x64 build of **Valorant Streamer Radar v$ver** from commit ``$sha``."
            ""
            "### Quick Install"
            "1. Download **``val-streamer-notifier.exe``** below."
            "2. Run it on Windows 10/11 while Valorant is installed (if Windows SmartScreen prompts for an unsigned open-source ``.exe``, click **More info -> Run anyway**)."
            "3. Runs silently in the system tray (~50-60 MB RAM, ~0% idle CPU) and scans strictly after each match ends."
            ""
            "> **Disclaimer:** Use at your own risk. See the [README](https://github.com/$repo#is-this-bannable) for safety details."
          ) -join "`n"
          Set-Content -Path "release-notes.md" -Value $notes -Encoding utf8

          gh release view latest 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit latest --title "$title" --notes-file "release-notes.md" --target "$sha" --latest
            gh release upload latest "target/release/val-streamer-notifier.exe" "target/release/val-streamer-notifier.exe.sha256" --clobber
          } else {
            gh release create latest "target/release/val-streamer-notifier.exe" "target/release/val-streamer-notifier.exe.sha256" --title "$title" --notes-file "release-notes.md" --target "$sha" --latest
          }

      - name: Publish to GitHub Releases (Versioned Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view "$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$tag" "target/release/val-streamer-notifier.exe" "target/release/val-streamer-notifier.exe.sha256" --clobber
          } else {
            gh release create "$tag" "target/release/val-streamer-notifier.exe" "target/release/val-streamer-notifier.exe.sha256" --title "Valorant Streamer Radar $tag" --generate-notes --latest
          }
